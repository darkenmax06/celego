// ── useTweaks ───────────────────────────────────────────────────────────────
// Single source of truth for tweak values. setTweak persists via the host
// (__edit_mode_set_keys → host rewrites the EDITMODE block on disk).
function useTweaks(defaults) {
  const [values, setValues] = React.useState(defaults);
  // Accepts either setTweak('key', value) or setTweak({ key: value, ... }) so a
  // useState-style call doesn't write a "[object Object]" key into the persisted
  // JSON block.
  const setTweak = React.useCallback((keyOrEdits, val) => {
    const edits = typeof keyOrEdits === 'object' && keyOrEdits !== null
      ? keyOrEdits : { [keyOrEdits]: val };
    setValues((prev) => ({ ...prev, ...edits }));
    window.parent.postMessage({ type: '__edit_mode_set_keys', edits }, '*');
  }, []);
  return [values, setTweak];
}

// ── TweaksPanel ─────────────────────────────────────────────────────────────
// Floating shell. Registers the protocol listener BEFORE announcing
// availability — if the announce ran first, the host's activate could land
// before our handler exists and the toolbar toggle would silently no-op.
// The close button posts __edit_mode_dismissed so the host's toolbar toggle
// flips off in lockstep; the host echoes __deactivate_edit_mode back which
// is what actually hides the panel.
function TweaksPanel({ title = 'Tweaks', children }) {
  const [open, setOpen] = React.useState(false);
  const dragRef = React.useRef(null);
  const offsetRef = React.useRef({ x: 16, y: 16 });
  const PAD = 16;

  const clampToViewport = React.useCallback(() => {
    const panel = dragRef.current;
    if (!panel) return;
    const w = panel.offsetWidth, h = panel.offsetHeight;
    const maxRight = Math.max(PAD, window.innerWidth - w - PAD);
    const maxBottom = Math.max(PAD, window.innerHeight - h - PAD);
    offsetRef.current = {
      x: Math.min(maxRight, Math.max(PAD, offsetRef.current.x)),
      y: Math.min(maxBottom, Math.max(PAD, offsetRef.current.y)),
    };
    panel.style.right = offsetRef.current.x + 'px';
    panel.style.bottom = offsetRef.current.y + 'px';
  }, []);

  React.useEffect(() => {
    if (!open) return;
    clampToViewport();
    if (typeof ResizeObserver === 'undefined') {
      window.addEventListener('resize', clampToViewport);
      return () => window.removeEventListener('resize', clampToViewport);
    }
    const ro = new ResizeObserver(clampToViewport);
    ro.observe(document.documentElement);
    return () => ro.disconnect();
  }, [open, clampToViewport]);

  React.useEffect(() => {
    const onMsg = (e) => {
      const t = e?.data?.type;
      if (t === '__activate_edit_mode') setOpen(true);
      else if (t === '__deactivate_edit_mode') setOpen(false);
    };
    window.addEventListener('message', onMsg);
    window.parent.postMessage({ type: '__edit_mode_available' }, '*');
    return () => window.removeEventListener('message', onMsg);
  }, []);

  const dismiss = () => {
    setOpen(false);
    window.parent.postMessage({ type: '__edit_mode_dismissed' }, '*');
  };

  const onDragStart = (e) => {
    const panel = dragRef.current;
    if (!panel) return;
    const r = panel.getBoundingClientRect();
    const sx = e.clientX, sy = e.clientY;
    const startRight = window.innerWidth - r.right;
    const startBottom = window.innerHeight - r.bottom;
    const move = (ev) => {
      offsetRef.current = {
        x: startRight - (ev.clientX - sx),
        y: startBottom - (ev.clientY - sy),
      };
      clampToViewport();
    };
    const up = () => {
      window.removeEventListener('mousemove', move);
      window.removeEventListener('mouseup', up);
    };
    window.addEventListener('mousemove', move);
    window.addEventListener('mouseup', up);
  };

  if (!open) return null;
  return (
    <>
      <style>{__TWEAKS_STYLE}</style>
      <div ref={dragRef} className="twk-panel" data-noncommentable=""
           style={{ right: offsetRef.current.x, bottom: offsetRef.current.y }}>
        <div className="twk-hd" onMouseDown={onDragStart}>
          <b>{title}</b>
          <button className="twk-x" aria-label="Close tweaks"
                  onMouseDown={(e) => e.stopPropagation()}
                  onClick={dismiss}>✕</button>
        </div>
        <div className="twk-body">{children}</div>
      </div>
    </>
  );
}

// ── Layout helpers ──────────────────────────────────────────────────────────

function TweakSection({ label, children }) {
  return (
    <>
      <div className="twk-sect">{label}</div>
      {children}
    </>
  );
}

function TweakRow({ label, value, children, inline = false }) {
  return (
    <div className={inline ? 'twk-row twk-row-h' : 'twk-row'}>
      <div className="twk-lbl">
        <span>{label}</span>
        {value != null && <span className="twk-val">{value}</span>}
      </div>
      {children}
    </div>
  );
}

// ── Controls ────────────────────────────────────────────────────────────────

function TweakSlider({ label, value, min = 0, max = 100, step = 1, unit = '', onChange }) {
  return (
    <TweakRow label={label} value={`${value}${unit}`}>
      <input type="range" className="twk-slider" min={min} max={max} step={step}
             value={value} onChange={(e) => onChange(Number(e.target.value))} />
    </TweakRow>
  );
}

function TweakToggle({ label, value, onChange }) {
  return (
    <div className="twk-row twk-row-h">
      <div className="twk-lbl"><span>{label}</span></div>
      <button type="button" className="twk-toggle" data-on={value ? '1' : '0'}
              role="switch" aria-checked={!!value}
              onClick={() => onChange(!value)}><i /></button>
    </div>
  );
}

function TweakRadio({ label, value, options, onChange }) {
  const trackRef = React.useRef(null);
  const [dragging, setDragging] = React.useState(false);
  const opts = options.map((o) => (typeof o === 'object' ? o : { value: o, label: o }));
  const idx = Math.max(0, opts.findIndex((o) => o.value === value));
  const n = opts.length;

  // The active value is read by pointer-move handlers attached for the lifetime
  // of a drag — ref it so a stale closure doesn't fire onChange for every move.
  const valueRef = React.useRef(value);
  valueRef.current = value;

  const segAt = (clientX) => {
    const r = trackRef.current.getBoundingClientRect();
    const inner = r.width - 4;
    const i = Math.floor(((clientX - r.left - 2) / inner) * n);
    return opts[Math.max(0, Math.min(n - 1, i))].value;
  };

  const onPointerDown = (e) => {
    setDragging(true);
    const v0 = segAt(e.clientX);
    if (v0 !== valueRef.current) onChange(v0);
    const move = (ev) => {
      if (!trackRef.current) return;
      const v = segAt(ev.clientX);
      if (v !== valueRef.current) onChange(v);
    };
    const up = () => {
      setDragging(false);
      window.removeEventListener('pointermove', move);
      window.removeEventListener('pointerup', up);
    };
    window.addEventListener('pointermove', move);
    window.addEventListener('pointerup', up);
  };

  return (
    <TweakRow label={label}>
      <div ref={trackRef} role="radiogroup" onPointerDown={onPointerDown}
           className={dragging ? 'twk-seg dragging' : 'twk-seg'}>
        <div className="twk-seg-thumb"
             style={{ left: `calc(2px + ${idx} * (100% - 4px) / ${n})`,
                      width: `calc((100% - 4px) / ${n})` }} />
        {opts.map((o) => (
          <button key={o.value} type="button" role="radio" aria-checked={o.value === value}>
            {o.label}
          </button>
        ))}
      </div>
    </TweakRow>
  );
}

function TweakSelect({ label, value, options, onChange }) {
  return (
    <TweakRow label={label}>
      <select className="twk-field" value={value} onChange={(e) => onChange(e.target.value)}>
        {options.map((o) => {
          const v = typeof o === 'object' ? o.value : o;
          const l = typeof o === 'object' ? o.label : o;
          return <option key={v} value={v}>{l}</option>;
        })}
      </select>
    </TweakRow>
  );
}

function TweakText({ label, value, placeholder, onChange }) {
  return (
    <TweakRow label={label}>
      <input className="twk-field" type="text" value={value} placeholder={placeholder}
             onChange={(e) => onChange(e.target.value)} />
    </TweakRow>
  );
}

function TweakNumber({ label, value, min, max, step = 1, unit = '', onChange }) {
  const clamp = (n) => {
    if (min != null && n < min) return min;
    if (max != null && n > max) return max;
    return n;
  };
  const startRef = React.useRef({ x: 0, val: 0 });
  const onScrubStart = (e) => {
    e.preventDefault();
    startRef.current = { x: e.clientX, val: value };
    const decimals = (String(step).split('.')[1] || '').length;
    const move = (ev) => {
      const dx = ev.clientX - startRef.current.x;
      const raw = startRef.current.val + dx * step;
      const snapped = Math.round(raw / step) * step;
      onChange(clamp(Number(snapped.toFixed(decimals))));
    };
    const up = () => {
      window.removeEventListener('pointermove', move);
      window.removeEventListener('pointerup', up);
    };
    window.addEventListener('pointermove', move);
    window.addEventListener('pointerup', up);
  };
  return (
    <div className="twk-num">
      <span className="twk-num-lbl" onPointerDown={onScrubStart}>{label}</span>
      <input type="number" value={value} min={min} max={max} step={step}
             onChange={(e) => onChange(clamp(Number(e.target.value)))} />
      {unit && <span className="twk-num-unit">{unit}</span>}
    </div>
  );
}

function TweakColor({ label, value, onChange }) {
  return (
    <div className="twk-row twk-row-h">
      <div className="twk-lbl"><span>{label}</span></div>
      <input type="color" className="twk-swatch" value={value}
             onChange={(e) => onChange(e.target.value)} />
    </div>
  );
}

function TweakButton({ label, onClick, secondary = false }) {
  return (
    <button type="button" className={secondary ? 'twk-btn secondary' : 'twk-btn'}
            onClick={onClick}>{label}</button>
  );
}

      )}

      {detailCard && <TarjetaDetailModal t={detailCard} onClose={()=>setDetailTc(null)} />}
      {showImport && <ImportModal onClose={()=>setShowImport(false)} />}
    </div>
  );
}

    setTels(prev => prev.map((t, i) => ({ ...t, principal: i === idx })));

        <div style={opStyles.mFooter}>

      </div>
    </div>
  );
}

function Operativo() {
  const [cards, setCards] = React.useState(REAL_TARJETAS.filter(t => t.status !== 'ENTREGADA'));
  const [urgentes, setUrgentes] = React.useState(REAL_URGENTES);
  const [tab, setTab] = React.useState('activos'); // 'activos' | 'urgentes'
  const [filterProv, setFilterProv] = React.useState('all');
  const [filterStatus, setFilterStatus] = React.useState('all');
  const [search, setSearch] = React.useState('');
  const [selectedIdx, setSelectedIdx] = React.useState(null);
  const [showReporte, setShowReporte] = React.useState(false);

  const activeData = tab === 'activos' ? cards : urgentes;
  const filtered = activeData.filter(c => {
    const mP = filterProv === 'all' || (c.provincia || c.zona) === filterProv;
    const mS = filterStatus === 'all' || c.status === filterStatus;
    const q = search.toLowerCase();
    const mQ = !q || c.tc.includes(q) || c.nombre.toLowerCase().includes(q) || c.cedula.includes(q);
    return mP && mS && mQ;
  });

  const provincias = [...new Set(activeData.map(c => c.provincia || c.zona))].sort();
  const contactadas = filtered.filter(c => c.contactado).length;

  return (
    <div style={opStyles.container}>
      <div style={opStyles.header}>
        <div>
          <h1 style={opStyles.title}>Operativo de Llamadas</h1>
          <p style={opStyles.sub}>{filtered.length} tarjetas · {contactadas} contactadas</p>
        </div>

      </div>

      {/* Tabs */}
      <div style={opStyles.tabsRow}>
        <button style={{ ...opStyles.tabBtn, ...(tab === 'activos' ? opStyles.tabActive : {}) }} onClick={() => setTab('activos')}>
          Tarjetas Activas <span style={opStyles.tabCount}>{cards.length}</span>
        </button>
        <button style={{ ...opStyles.tabBtn, ...(tab === 'urgentes' ? { ...opStyles.tabActive, color: 'oklch(0.65 0.22 25)', borderColor: 'oklch(0.65 0.22 25)' } : {}) }} onClick={() => setTab('urgentes')}>
          Urgentes <span style={{ ...opStyles.tabCount, ...(tab === 'urgentes' ? { background: 'oklch(0.65 0.22 25 / 0.12)', color: 'oklch(0.65 0.22 25)' } : {}) }}>{urgentes.length}</span>
        </button>
      </div>

      {/* Filters */}
      <div style={opStyles.filters}>
        <input value={search} onChange={e => setSearch(e.target.value)} placeholder="Buscar TC, cédula o nombre..." style={opStyles.searchInput} />
        <select value={filterProv} onChange={e => setFilterProv(e.target.value)} style={opStyles.sel}>
          <option value="all">Todas las provincias</option>
          {provincias.map(p => <option key={p}>{p}</option>)}
        </select>
        <select value={filterStatus} onChange={e => setFilterStatus(e.target.value)} style={opStyles.sel}>
          <option value="all">Todos los status</option>
          {STATUS_OPTIONS.map(s => <option key={s.id} value={s.id}>{s.label}</option>)}
        </select>
      </div>

      {/* List */}
      <div style={{ background: '#fff', borderRadius: 12, border: '1px solid #ebebea', overflow: 'hidden' }}>
        {filtered.length === 0 && (
          <div style={{ padding: '32px', textAlign: 'center', color: '#ccc', fontFamily: "'DM Sans',sans-serif", fontSize: 14 }}>No hay tarjetas con estos filtros</div>
        )}
        {filtered.map((card, i) => {
          const telP = card.telefonos?.find(t => t.principal) || card.telefonos?.[0];
          return (
            <div key={card.tc} style={{ ...opStyles.listRow, borderBottom: i < filtered.length - 1 ? '1px solid #f4f4f2' : 'none', background: card.contactado ? 'oklch(0.58 0.18 145 / 0.03)' : '#fff' }}>
              <div style={opStyles.listAvatar}>{card.nombre.split(' ').slice(0,2).map(w=>w[0]).join('')}</div>
              <div style={{ flex: 1 }}>
                <div style={{ display: 'flex', gap: 8, alignItems: 'center' }}>
                  <span style={opStyles.listNombre}>{card.nombre}</span>
                  <span style={opStyles.listTC}>{card.tc}</span>
                  {card.contactado && <span style={opStyles.contactadoBadge}>✓ Contactado</span>}
                </div>
                <div style={{ display: 'flex', gap: 8, marginTop: 2, flexWrap: 'wrap' }}>
                  <span style={opStyles.listMeta}>{card.cedula}</span>
                  <span style={opStyles.listMeta}>·</span>
                  <span style={opStyles.listMeta}>{card.provincia || card.zona}</span>
                  {telP && <><span style={opStyles.listMeta}>·</span><span style={opStyles.listTel}>{telP.num}</span></>}
                  {card.comentarioContacto && <><span style={opStyles.listMeta}>·</span><span style={{ ...opStyles.listMeta, color: '#888', fontStyle: 'italic' }}>"{card.comentarioContacto}"</span></>}
                </div>
              </div>
              <div style={{ display: 'flex', gap: 8, alignItems: 'center', flexShrink: 0 }}>
                <StatusBadge statusId={card.status} />
                <button style={opStyles.callBtn} onClick={() => setSelectedIdx(i)}>Contactar →</button>
              </div>
            </div>
          );
        })}
      </div>

      {selectedIdx !== null && filtered[selectedIdx] && (
        <ContactModal
          card={filtered[selectedIdx]}
          idx={selectedIdx}
          total={filtered.length}
          onClose={() => setSelectedIdx(null)}
          onNext={() => setSelectedIdx(i => Math.min(i + 1, filtered.length - 1))}
          onPrev={() => setSelectedIdx(i => Math.max(i - 1, 0))}
        />
      )}
      {showReporte && <ReporteContactosModal data={filtered} onClose={() => setShowReporte(false)} />}
    </div>
  );
}

// Lotes Module — basado en estructura real LOTE 22-4-2026.xlsx y Esquema seguimiento

function LoteModal({ lote, onClose }) {
  const [tarjetas, setTarjetas] = React.useState(lote.tarjetas.map(t => ({ ...t })));

  const toggleRecibida = (i) => setTarjetas(prev => prev.map((t, j) => j === i ? { ...t, recibida: !t.recibida, retornada: t.recibida ? t.retornada : false } : t));
  const toggleRetornada = (i) => setTarjetas(prev => prev.map((t, j) => j === i ? { ...t, retornada: !t.retornada, recibida: t.retornada ? t.recibida : false } : t));

  const recibidas = tarjetas.filter(t => t.recibida).length;
  const retornadas = tarjetas.filter(t => t.retornada).length;
  const pendientes = tarjetas.length - recibidas - retornadas;

  return (
    <div style={lotStyles.overlay} onClick={onClose}>
      <div style={lotStyles.modal} onClick={e => e.stopPropagation()}>
        <div style={lotStyles.mHeader}>
          <div>
            <div style={lotStyles.mLoteId}>LOTE {lote.loteId}</div>
            <div style={lotStyles.mNombre}>{lote.nombre} — {lote.provincia}</div>
          </div>
          <button onClick={onClose} style={lotStyles.closeBtn}>✕</button>
        </div>

        {/* Stats */}
        <div style={lotStyles.statsRow}>
          {[
            { label: 'Total', val: tarjetas.length, color: '#333' },
            { label: 'Recibidas', val: recibidas, color: 'oklch(0.58 0.18 145)' },
            { label: 'Retornadas', val: retornadas, color: 'oklch(0.65 0.22 25)' },
            { label: 'Pendientes', val: pendientes, color: 'oklch(0.55 0.18 260)' },
          ].map(s => (
            <div key={s.label} style={lotStyles.statChip}>
              <span style={{ ...lotStyles.statVal, color: s.color }}>{s.val}</span>
              <span style={lotStyles.statLabel}>{s.label}</span>
            </div>
          ))}
        </div>

        <div style={lotStyles.mBody}>
          <div style={lotStyles.tableHead}>
            <span style={{ flex: '0 0 170px' }}>No. Tarjeta</span>
            <span style={{ flex: '0 0 130px' }}>Cédula</span>
            <span style={{ flex: '0 0 130px' }}>Teléfono</span>
            <span style={{ flex: 1 }}></span>
            <span style={{ flex: '0 0 100px', textAlign: 'center' }}>Recibida</span>
            <span style={{ flex: '0 0 100px', textAlign: 'center' }}>Retornada</span>
          </div>
          {tarjetas.map((t, i) => (
            <div key={t.tc} style={{ ...lotStyles.tableRow, background: t.recibida ? 'oklch(0.58 0.18 145 / 0.04)' : t.retornada ? 'oklch(0.65 0.22 25 / 0.04)' : '#fff', borderBottom: i < tarjetas.length - 1 ? '1px solid #f4f4f2' : 'none' }}>
              <span style={{ ...lotStyles.tcCode, flex: '0 0 170px' }}>{t.tc}</span>
              <span style={{ fontFamily: "'Space Grotesk',sans-serif", fontSize: 12, color: '#888', flex: '0 0 130px' }}>{t.cedula}</span>
              <span style={{ fontFamily: "'Space Grotesk',sans-serif", fontSize: 12, color: '#555', flex: '0 0 130px' }}>{t.telefono || '—'}</span>
              <span style={{ flex: 1 }}></span>
              <div style={{ flex: '0 0 100px', display: 'flex', justifyContent: 'center' }}>
                <label style={{ display: 'flex', alignItems: 'center', gap: 5, cursor: 'pointer' }}>
                  <input type="checkbox" checked={t.recibida} onChange={() => toggleRecibida(i)} style={{ accentColor: 'oklch(0.58 0.18 145)', width: 16, height: 16 }} />
                  {t.recibida && <span style={{ fontFamily: "'Space Grotesk',sans-serif", fontSize: 11, color: 'oklch(0.58 0.18 145)', fontWeight: 700 }}>✓</span>}
                </label>
              </div>
              <div style={{ flex: '0 0 100px', display: 'flex', justifyContent: 'center' }}>
                <label style={{ display: 'flex', alignItems: 'center', gap: 5, cursor: 'pointer' }}>
                  <input type="checkbox" checked={t.retornada} onChange={() => toggleRetornada(i)} style={{ accentColor: 'oklch(0.65 0.22 25)', width: 16, height: 16 }} />
                  {t.retornada && <span style={{ fontFamily: "'Space Grotesk',sans-serif", fontSize: 11, color: 'oklch(0.65 0.22 25)', fontWeight: 700 }}>✓</span>}
                </label>
              </div>
            </div>
          ))}
        </div>
        <div style={lotStyles.mFooter}>
          <button style={lotStyles.btnSecondary} onClick={onClose}>Cerrar</button>
          <button style={lotStyles.btnSecondary}>↓ Excel</button>
          <button style={lotStyles.btnPrimary}>✓ Guardar cambios</button>
        </div>
      </div>
    </div>
  );
}

// Redaccion Module — con datos reales de ENTREGAS Y RETORNOS 24-4-2026.xlsx

function Redaccion() {
  const [mode, setMode] = React.useState('retorno');
  const [retornos, setRetornos] = React.useState(REAL_RETORNOS.map(r => ({ ...r })));
  const [entregas, setEntregas] = React.useState(
    REAL_TARJETAS.filter(t => t.status === 'ENTREGADA').map((t, i) => ({
      no: String(i + 1),
      tc: t.tc,
      nombre: t.nombre,
      cedula: t.cedula,
      fecha: t.fechaDespacho,
      zona: t.zona || t.provincia,
      comentario: '',
    }))
  );
  const [scanInput, setScanInput] = React.useState('');
  const [selected, setSelected] = React.useState([]);
  const [bulkMotivo, setBulkMotivo] = React.useState('');
  const [showApprove, setShowApprove] = React.useState(false);
  const [fecha, setFecha] = React.useState('24/04/2026');
  const [zona, setZona] = React.useState('ESTE');

  const lista = mode === 'retorno' ? retornos : entregas;

  const updateMotivo = (tc, val) => {
    if (mode === 'retorno') setRetornos(prev => prev.map(r => r.tc === tc ? { ...r, comentario: val } : r));
  };

  const toggleSelect = (tc) => setSelected(s => s.includes(tc) ? s.filter(x => x !== tc) : [...s, tc]);

  const applyBulk = () => {
    if (bulkMotivo && selected.length > 0) {
      setRetornos(prev => prev.map(r => selected.includes(r.tc) ? { ...r, comentario: bulkMotivo } : r));
      setSelected([]);
      setBulkMotivo('');
    }
  };

  const handleScan = (e) => {
    if (e.key === 'Enter' && scanInput.trim()) {
      const val = scanInput.trim();
      const found = REAL_TARJETAS.find(t => t.tc === val || t.cedula === val);
      if (found) {
        const newEntry = { no: String(lista.length + 1), tc: found.tc, nombre: found.nombre, cedula: found.cedula, fecha: found.fechaDespacho, zona: found.zona || found.provincia, comentario: '' };
        if (mode === 'retorno') setRetornos(prev => [...prev, newEntry]);
        else setEntregas(prev => [...prev, newEntry]);
      }
      setScanInput('');
    }
  };

  const removeRow = (tc) => {
    if (mode === 'retorno') setRetornos(prev => prev.filter(r => r.tc !== tc));
    else setEntregas(prev => prev.filter(r => r.tc !== tc));
  };

  return (
    <div style={redStyles.container}>
      <div style={redStyles.header}>
        <div>
          <h1 style={redStyles.title}>Redacción</h1>
          <p style={redStyles.sub}>Acuses de entrega y retornos · Zona {zona}</p>
        </div>
        <div style={{ display: 'flex', gap: 8, alignItems: 'center' }}>
          <input type="text" value={fecha} onChange={e => setFecha(e.target.value)} placeholder="Fecha" style={redStyles.dateInput} />
          <select value={zona} onChange={e => setZona(e.target.value)} style={redStyles.sel}>
            {['METRO','ESTE','NORTE','SUR'].map(z => <option key={z}>{z}</option>)}
          </select>
          <button style={redStyles.btnSecondary}>↓ Excel</button>
          <button style={redStyles.btnSecondary}>↓ PDF</button>
          <button style={redStyles.btnPrimary} onClick={() => setShowApprove(true)}>✓ Aprobar Redacción</button>
        </div>
      </div>

      {/* Mode tabs */}
      <div style={redStyles.modeTabs}>
        <button style={{ ...redStyles.modeBtn, ...(mode === 'retorno' ? { ...redStyles.modeBtnActive, borderColor: 'oklch(0.65 0.22 25)', color: 'oklch(0.65 0.22 25)', background: 'oklch(0.65 0.22 25 / 0.05)' } : {}) }} onClick={() => setMode('retorno')}>
          Tarjetas Retornadas
          <span style={{ ...redStyles.modeCount, ...(mode === 'retorno' ? { background: 'oklch(0.65 0.22 25 / 0.15)', color: 'oklch(0.65 0.22 25)' } : {}) }}>{retornos.length}</span>
        </button>
        <button style={{ ...redStyles.modeBtn, ...(mode === 'entrega' ? redStyles.modeBtnActive : {}) }} onClick={() => setMode('entrega')}>
          Acuses de Entrega
          <span style={redStyles.modeCount}>{entregas.length}</span>
        </button>
      </div>

      {/* Scan bar */}
      <div style={redStyles.scanBar}>
        <div style={redStyles.scanIcon}>⊙</div>
        <input
          value={scanInput}
          onChange={e => setScanInput(e.target.value)}
          onKeyDown={handleScan}
          placeholder="Pistolear código de barras o digitar No. TC / Cédula... (↵ para agregar)"
          style={redStyles.scanInput}
          autoFocus
        />
        <span style={redStyles.scanHint}>↵ Enter para agregar</span>
      </div>

      {/* Bulk motivo for retornos */}

        <div style={redStyles.bulkBar}>
          <span style={redStyles.bulkCount}>{selected.length} seleccionadas</span>
          <select value={bulkMotivo} onChange={e => setBulkMotivo(e.target.value)} style={redStyles.bulkSel}>

            {MOTIVOS_RETORNO.map(m => <option key={m}>{m}</option>)}
          </select>
          <button style={redStyles.btnPrimary} onClick={applyBulk}>Aplicar a seleccionadas</button>
          <button style={redStyles.btnSecondary} onClick={() => setSelected([])}>Cancelar</button>
        </div>
      )}

        {/* Header */}
        <div style={{ display: 'grid', gridTemplateColumns: mode === 'retorno' ? '30px 40px 175px 130px 1fr 80px 220px 36px' : '30px 40px 175px 130px 1fr 80px 36px', gap: 8, padding: '9px 14px', background: '#f8f8f6', borderBottom: '1px solid #ebebea', fontFamily: "'Space Grotesk',sans-serif", fontSize: 11, fontWeight: 600, color: '#aaa', textTransform: 'uppercase', letterSpacing: '0.04em', alignItems: 'center' }}>

          {mode === 'retorno' && <span>Motivo</span>}
          <span></span>
        </div>
        {lista.length === 0 && (
          <div style={{ padding: '32px', textAlign: 'center', color: '#ccc', fontFamily: "'DM Sans',sans-serif", fontSize: 14 }}>

          </div>
        )}
        {lista.map((row, i) => (
          <div key={row.tc} style={{ display: 'grid', gridTemplateColumns: mode === 'retorno' ? '30px 40px 175px 130px 1fr 80px 220px 36px' : '30px 40px 175px 130px 1fr 80px 36px', gap: 8, padding: '9px 14px', borderBottom: i < lista.length - 1 ? '1px solid #f4f4f2' : 'none', alignItems: 'center', background: selected.includes(row.tc) ? 'oklch(0.65 0.22 25 / 0.04)' : '#fff' }}>
            <span style={{ display: 'flex', alignItems: 'center' }}>
              {mode === 'retorno' && <input type="checkbox" checked={selected.includes(row.tc)} onChange={() => toggleSelect(row.tc)} style={{ accentColor: 'oklch(0.65 0.22 25)' }} />}
            </span>
            <span style={{ fontFamily: "'Space Grotesk',sans-serif", fontSize: 12, color: '#ccc', fontWeight: 600 }}>{row.no}</span>
            <span style={{ fontFamily: "'Space Grotesk',sans-serif", fontSize: 11.5, color: 'oklch(0.55 0.18 260)', fontWeight: 600, letterSpacing: '0.02em' }}>{row.tc}</span>
            <span style={{ fontFamily: "'Space Grotesk',sans-serif", fontSize: 12, color: '#aaa' }}>{row.cedula}</span>
            <span style={{ fontFamily: "'DM Sans',sans-serif", fontSize: 13, color: '#333', fontWeight: 400 }}>{row.nombre}</span>
            <span style={{ fontFamily: "'Space Grotesk',sans-serif", fontSize: 11.5, color: '#888' }}>{row.fecha}</span>
            {mode === 'retorno' && (
              <input
                value={row.comentario}
                onChange={e => updateMotivo(row.tc, e.target.value)}
                placeholder="Motivo..."
                list="motivos-list"
                style={redStyles.motivoInput}
              />
            )}
            <button onClick={() => removeRow(row.tc)} style={redStyles.removeBtn}>✕</button>
          </div>
        ))}
        <datalist id="motivos-list">
          {MOTIVOS_RETORNO.map(m => <option key={m} value={m} />)}
        </datalist>
      </div>

      {/* Approve modal */}
      {showApprove && (
        <div style={redStyles.overlay} onClick={() => setShowApprove(false)}>
          <div style={redStyles.approveModal} onClick={e => e.stopPropagation()}>
            <div style={redStyles.approveHeader}>Confirmar Redacción</div>
            <div style={{ padding: '18px 20px' }}>
              <p style={{ fontFamily: "'DM Sans',sans-serif", fontSize: 14, color: '#555', margin: '0 0 16px' }}>

            <div style={{ display: 'flex', justifyContent: 'flex-end', gap: 8, padding: '12px 20px', borderTop: '1px solid #f0f0ee' }}>

              <button style={redStyles.btnPrimary} onClick={() => setShowApprove(false)}>✓ Aprobar y actualizar</button>
            </div>
          </div>
        </div>
      )}
    </div>
  );
}

function calcTotal(mensajero, historial) {
  return historial.reduce((sum, d) => {
    const tarifaMap = {};
    mensajero.tarifas.forEach(t => tarifaMap[t.tipo] = t.precio);
    return sum
      + (d.entregas || 0) * (tarifaMap['Entrega Normal'] || 0)
      + (d.remotas || 0) * (tarifaMap['Zona Remota'] || 0)
      + (d.recogidas || 0) * (tarifaMap['Recogida a Banco'] || 0)
      + (d.mandados || 0) * (tarifaMap['Mandado'] || 0);
  }, 0);

    setZonas(prev => prev.map((z, zi) => zi !== zonaIdx ? z : {
      ...z,
      rangos: z.rangos.map((r, ri) => ri !== rangoIdx ? r : { ...r, precio: parseFloat(val) || 0 })
    }));
  };

  return (
    <div style={facStyles.container}>
      <div style={facStyles.header}>
        <div>
          <h1 style={facStyles.title}>Facturación</h1>
          <p style={facStyles.subtitle}>Tarifas por zona y rangos de volumen</p>
        </div>
        <div style={{ display: 'flex', gap: 8 }}>
          <button style={facStyles.btnSecondary}>↓ Reporte Facturación</button>
          <button style={facStyles.btnPrimary}>Generar Factura</button>
        </div>
      </div>

      {/* Periodo selector */}
      <div style={facStyles.periodoBar}>
        <span style={facStyles.periodoLabel}>Período de facturación:</span>
        <input type="date" value={periodo.desde} onChange={e => setPeriodo(p => ({ ...p, desde: e.target.value }))} style={facStyles.dateInput} />
        <span style={{ color: '#aaa', fontFamily: "'DM Sans', sans-serif", fontSize: 13 }}>al</span>
        <input type="date" value={periodo.hasta} onChange={e => setPeriodo(p => ({ ...p, hasta: e.target.value }))} style={facStyles.dateInput} />
        <button style={facStyles.btnPrimary}>Calcular</button>
      </div>

      {/* Resumen */}
      <div style={{ display: 'grid', gridTemplateColumns: 'repeat(4, 1fr)', gap: 12, marginBottom: 24 }}>
        {zonas.map(z => (
          <div key={z.zona} style={{ ...facStyles.summaryCard, borderTop: `3px solid ${z.color}` }}>
            <div style={{ fontFamily: "'Space Grotesk', sans-serif", fontSize: 13, fontWeight: 600, color: '#555', marginBottom: 8 }}>Zona {z.zona}</div>
            <div style={{ fontFamily: "'Space Grotesk', sans-serif", fontSize: 28, fontWeight: 700, color: z.color, letterSpacing: '-0.04em' }}>$0.00</div>
            <div style={{ fontFamily: "'DM Sans', sans-serif", fontSize: 12, color: '#aaa', marginTop: 2 }}>0 entregas</div>
          </div>
        ))}
      </div>

      {/* Tarifas configuración */}
      <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: 16 }}>
        {zonas.map((z, zi) => (
          <div key={z.zona} style={facStyles.zonaCard}>
            <div style={{ display: 'flex', alignItems: 'center', gap: 8, marginBottom: 14 }}>
              <div style={{ width: 10, height: 10, borderRadius: '50%', background: z.color }}></div>
              <span style={facStyles.zonaName}>Zona {z.zona}</span>
            </div>
            <div style={facStyles.rangoHeader}>
              <span style={{ flex: '0 0 80px' }}>Desde</span>
              <span style={{ flex: '0 0 80px' }}>Hasta</span>
              <span style={{ flex: 1 }}>Precio (USD)</span>
            </div>
            {z.rangos.map((r, ri) => (
              <div key={ri} style={facStyles.rangoRow}>
                <span style={{ ...facStyles.rangoVal, flex: '0 0 80px' }}>{r.desde}</span>
                <span style={{ ...facStyles.rangoVal, flex: '0 0 80px' }}>{r.hasta || '∞'}</span>
                <div style={{ flex: 1, display: 'flex', alignItems: 'center', gap: 6 }}>
                  <span style={facStyles.dollar}>$</span>
                  <input
                    type="number"
                    step="0.25"
                    value={r.precio}
                    onChange={e => updatePrecio(zi, ri, e.target.value)}
                    style={facStyles.precioInput}
                  />
                </div>
              </div>
            ))}
            <button style={facStyles.addRangoBtn}>+ Agregar rango</button>
          </div>
        ))}
      </div>
    </div>
  );
}

const TWEAK_DEFAULTS = /*EDITMODE-BEGIN*/{
  "accentColor": "oklch(0.55 0.18 260)",
  "bgColor": "#f5f5f3",
  "density": "normal",
  "sidebarDark": true
}/*EDITMODE-END*/;

function App() {
  const [tweaks, setTweak] = useTweaks(TWEAK_DEFAULTS);
  const [activeModule, setActiveModule] = React.useState('dashboard');

  const renderModule = () => {
    switch (activeModule) {
      case 'dashboard':     return <Dashboard setActiveModule={setActiveModule} />;
      case 'tarjetas':      return <Tarjetas />;
      case 'rutas':         return <Rutas />;
      case 'operativo':     return <Operativo />;
      case 'redaccion':     return <Redaccion />;
      case 'mensajeros':    return <Mensajeros />;
      case 'facturacion':   return <Facturacion />;
      case 'reportes':      return <Reportes />;
      case 'configuracion': return <Configuracion />;
      default:              return <Dashboard setActiveModule={setActiveModule} />;
    }
  };

  return (
    <div style={{ display: 'flex', height: '100vh', background: tweaks.bgColor, overflow: 'hidden' }}>
      <Sidebar activeModule={activeModule} setActiveModule={setActiveModule} alerts={REAL_URGENTES.length} />
      <main style={{ marginLeft: 220, flex: 1, overflowY: 'auto', minHeight: '100vh' }}>
        {renderModule()}
      </main>
      <TweaksPanel>
        <TweakSection title="Apariencia">
          <TweakColor id="accentColor" label="Color de acento" value={tweaks.accentColor} onChange={v => setTweak('accentColor', v)} />
          <TweakColor id="bgColor" label="Fondo general" value={tweaks.bgColor} onChange={v => setTweak('bgColor', v)} />
          <TweakRadio id="density" label="Densidad" value={tweaks.density} options={["compact", "normal", "comfortable"]} onChange={v => setTweak('density', v)} />
          <TweakToggle id="sidebarDark" label="Sidebar oscuro" value={tweaks.sidebarDark} onChange={v => setTweak('sidebarDark', v)} />
        </TweakSection>
      </TweaksPanel>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
